<!doctype html>

  <head>
    <script>
      // Suppress Vite HMR WebSocket connection errors per environment guidelines
      window.addEventListener('error', function(event) {
        if (event && (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client')) || (event.filename && event.filename.includes('@vite/client')))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && (String(event.reason).includes('WebSocket') || (event.reason && event.reason.message && event.reason.message.includes('WebSocket')))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
